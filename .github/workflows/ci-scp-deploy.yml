name: CI Build & SCP Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      BACKEND_DIR: backend/go
      BIN_NAME: gatherup-server
      KEEP_RELEASES: 5

    steps:
      # ---------------------------------------------
      # Checkout
      # ---------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------
      # Generate ONE timestamp for upload + install
      # ---------------------------------------------
      - name: Set timestamp
        run: echo "TS=$(date +%s)" >> $GITHUB_ENV

      # ---------------------------------------------
      # Install Go
      # ---------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      # ---------------------------------------------
      # Cache modules
      # ---------------------------------------------
      - name: Cache modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      # ---------------------------------------------
      # Run tests
      # ---------------------------------------------
      - name: Run tests
        run: |
          cd ${{ env.BACKEND_DIR }}
          go test ./... -v

      # ---------------------------------------------
      # Build binary
      # ---------------------------------------------
      - name: Build linux binary
        run: |
          cd ${{ env.BACKEND_DIR }}
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -v -o ../../${{ env.BIN_NAME }} ./cmd/server
          ls -l ../../${{ env.BIN_NAME }}

      # ---------------------------------------------
      # Validate secrets
      # ---------------------------------------------
      - name: Validate required secrets
        run: |
          [ -n "${{ secrets.VPS_SSH_KEY }}" ] || exit 1
          [ -n "${{ secrets.VPS_HOST }}" ] || exit 1
          [ -n "${{ secrets.VPS_USER }}" ] || exit 1
          [ -n "${{ secrets.REMOTE_DIR }}" ] || exit 1
          [ -n "${{ secrets.SYSTEMD_SERVICE }}" ] || exit 1
          echo "Secrets OK"

      # ---------------------------------------------
      # SSH Agent
      # ---------------------------------------------
      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # ---------------------------------------------
      # Add remote host to known_hosts
      # ---------------------------------------------
      - name: Add remote host to known_hosts
        run: |
          PORT=${{ secrets.VPS_PORT || '22' }}
          ssh-keyscan -p "$PORT" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # ---------------------------------------------
      # Upload binary to server
      # ---------------------------------------------
      - name: Upload binary via SCP
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          TS=${TS}
          PORT="${VPS_PORT:-22}"
          LOCAL="./${{ env.BIN_NAME }}"
          DIR="${REMOTE_DIR}/releases/${TS}"
          echo "Creating remote dir: ${DIR}"
          ssh -p "$PORT" "${VPS_USER}@${VPS_HOST}" "mkdir -p '${DIR}'"
          echo "Uploading ${LOCAL} -> ${VPS_USER}@${VPS_HOST}:${DIR}/${{ env.BIN_NAME }}"
          scp -P "$PORT" "${LOCAL}" "${VPS_USER}@${VPS_HOST}:${DIR}/${{ env.BIN_NAME }}"

      # ---------------------------------------------
      # Install + Symlink + Restart service
      # ---------------------------------------------
      - name: Install binary & restart service
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          SYSTEMD_SERVICE: ${{ secrets.SYSTEMD_SERVICE }}
          KEEP_RELEASES: ${{ env.KEEP_RELEASES }}
        run: |
          TS=${TS}
          PORT="${VPS_PORT:-22}"
          DIR="${REMOTE_DIR}/releases/${TS}"
          BIN="${REMOTE_DIR}/${{ env.BIN_NAME }}"

          ssh -p "$PORT" "${VPS_USER}@${VPS_HOST}" bash -lc "
          sudo ln -sfn '$DIR/${{ env.BIN_NAME }}' '$BIN'
          sudo chmod +x '$DIR/${{ env.BIN_NAME }}'
          cd '${REMOTE_DIR}/releases'
          ls -1t | tail -n +$(( ${KEEP_RELEASES} + 1 )) | xargs -r sudo rm -rf --
          sudo systemctl daemon-reload
          sudo systemctl restart '${SYSTEMD_SERVICE}'
          sudo journalctl -u '${SYSTEMD_SERVICE}' -n 50 --no-pager
          "
